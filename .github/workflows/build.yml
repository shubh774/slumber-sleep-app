name: Build Slumber Android APK and Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Build Debug APK and AAB Bundle
      run: |
        gradle assembleDebug bundleDebug --stacktrace

    - name: Upload APK and Bundle Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Slumber-App-Builds
        path: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/bundle/debug/*.aab
