name: Build Slumber Android APK and Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Setup Release Keystore
      run: |
        echo "" | base64 --decode > app/slumber_release.jks

    - name: Build Signed Release AAB and Debug APK
      run: |
        gradle bundleRelease assembleDebug --stacktrace

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Slumber-Production-Builds
        path: |
          app/build/outputs/bundle/release/*.aab
          app/build/outputs/apk/debug/*.apk
